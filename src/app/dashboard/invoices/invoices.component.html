<div class="invoice-container">
    <div class="title-row">
        <h2>Invoices</h2>
        <app-button [title]="'Create Invoice'" [routerLink]="'/create-invoice'"></app-button>
    </div>

    <div class="customer-list">
        <app-table [headers]="headers" [data]="invoices" (view)="viewInvoice($event)"></app-table>
        <app-pagination
            [pageIndex]="pageIndex"
            [pageSize]="pageSize"
            [totalItems]="totalItems"
            (pageChange)="onPageChange($event)">
        </app-pagination>
    </div>
</div>
