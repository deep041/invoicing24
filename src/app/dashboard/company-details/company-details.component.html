<div class="invoice-container">
    <div class="title-row">
        <h2>Company Details</h2>
    </div>

    <form class="company-details-form" [formGroup]="companyDetailsForm">
        <div class="input-group">
            <app-input [placeholder]="'Name'" [label]="'Name'" formControlName="name"></app-input>
            <app-input [placeholder]="'Contact No.'" [label]="'Contact No.'" formControlName="contactNo"></app-input>
        </div>
        <div class="input-group">
            <app-input [placeholder]="'GST No.'" [label]="'GST No.'" formControlName="gstNo"></app-input>
            <app-select [label]="'State'" [options]="stateOptions" formControlName="stateCode"></app-select>
        </div>
        <app-textarea [placeholder]="'Address'" [label]="'Address'" formControlName="address"></app-textarea>
    </form>

    <div class="footer-button-container">
        <app-button [title]="'Save'" (click)="save()"></app-button>
    </div>
</div>
