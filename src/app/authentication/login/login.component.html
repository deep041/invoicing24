<div class="login-container">
    <form [formGroup]="loginForm">
        <div class="login-box">
            <h2>Login</h2>
            <app-input formControlName="email" [placeholder]="'Enter your Email ID'" />
            <app-input formControlName="password" [type]="'password'" [placeholder]="'Enter your password'" />
        
            <app-button [title]="'Login'" (click)="login()"></app-button>
    
            <span class="last-text">New here? <span class="redirection" (click)="redirect('authentication/register')">Register</span></span>
        </div>
    </form>
</div>
